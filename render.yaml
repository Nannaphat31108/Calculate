services:
  - type: web
    name: wood-price
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wood-price-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false

databases:
  - name: wood-price-db
    plan: free
    region: singapore
    databaseName: wood
    user: wood
